<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Registro — Agro Market ULEAM</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head><body>
<div class="container" style="max-width:480px;margin-top:60px">
  <div class="card shadow-sm border-0 p-4">
    <h4 class="fw-bold text-success text-center mb-1">Crear cuenta</h4>
    <p class="text-center text-muted small mb-3">Solo estudiantes y docentes ULEAM</p>
    <div id="error-msg" class="alert alert-danger d-none"></div>
    <div class="row g-2 mb-3">
      <div class="col-6">
        <label class="form-label">Nombre *</label>
        <input type="text" id="nombre" class="form-control">
      </div>
      <div class="col-6">
        <label class="form-label">Apellido *</label>
        <input type="text" id="apellido" class="form-control">
      </div>
    </div>
    <div class="mb-3">
      <input type="email" id="correo" class="form-control">
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña * (mínimo 6 caracteres)</label>
      <input type="password" id="password" class="form-control">
    </div>
    <button class="btn btn-success w-100 fw-bold" onclick="registrar()">
      <i class="bi bi-person-plus"></i> Registrarme
    </button>
    <hr>
    <p class="text-center mb-0 small">¿Ya tienes cuenta?
      <a href="login.html" class="text-success fw-bold">Inicia sesión</a></p>
  </div>
</div>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
<script>
  async function registrar() {
    const nombre   = document.getElementById("nombre").value.trim();
    const apellido = document.getElementById("apellido").value.trim();
    const correo   = document.getElementById("correo").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const errEl    = document.getElementById("error-msg");
    errEl.classList.add("d-none");

    if (!nombre || !apellido || !correo || !password) {
      errEl.textContent = "Completa todos los campos.";
      errEl.classList.remove("d-none"); return;
    }
    if (!correo.endsWith(DOMINIO)) {
      errEl.textContent = "Solo se permiten correos " + DOMINIO;
      errEl.classList.remove("d-none"); return;
    }
    try {
      const cred = await auth.createUserWithEmailAndPassword(correo, password);
      // MOO: HERENCIA — crearUsuarioDB siempre asigna rol "cliente"
      await crearUsuarioDB(cred.user.uid, { nombre, apellido, correo });
      window.location.href = "catalogo.html";
    } catch(e) {
      if (e.code === "auth/email-already-in-use")
        errEl.textContent = "Ese correo ya está registrado.";
      else errEl.textContent = "Error: " + e.message;
      errEl.classList.remove("d-none");
    }
  }
</script>
</body></html>

<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — Agro Market ULEAM</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head><body>
<div class="container" style="max-width:440px;margin-top:80px">
  <div class="card shadow-sm border-0 p-4">
    <div class="text-center mb-4">
      <span style="font-size:3rem">🌱</span>
      <h3 class="fw-bold text-success mt-1">Agro Market ULEAM</h3>
      <p class="text-muted small">Solo correos @uleam.edu.ec</p>
    </div>
    <div id="error-msg" class="alert alert-danger d-none"></div>
    <div class="mb-3">
      <label class="form-label">Correo institucional</label>
      <input type="email" id="correo" class="form-control" placeholder="usuario@uleam.edu.ec">
    </div>
    <div class="mb-3">
      <label class="form-label">Contraseña</label>
      <input type="password" id="password" class="form-control">
    </div>
    <button class="btn btn-success w-100 fw-bold" onclick="iniciarSesion()">
      <i class="bi bi-box-arrow-in-right"></i> Ingresar
    </button>
    <hr>
    <p class="text-center mb-0 small">¿No tienes cuenta?
      <a href="registro.html" class="text-success fw-bold">Regístrate</a></p>
  </div>
</div>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/db.js"></script>
<script>
  // Si ya hay sesión activa, redirigir según rol
  auth.onAuthStateChanged(async (user) => {
    if (!user) return;
    const datos = await obtenerUsuario(user.uid);
    if (!datos) return;
    if (datos.rol === "administrador") window.location.href = "admin/dashboard.html";
    else window.location.href = "catalogo.html";
  });

  async function iniciarSesion() {
    const correo   = document.getElementById("correo").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const errEl    = document.getElementById("error-msg");
    errEl.classList.add("d-none");

    if (!correo.endsWith(DOMINIO)) {
      errEl.textContent = "Solo se permiten correos " + DOMINIO;
      errEl.classList.remove("d-none"); return;
    }
    try {
      await auth.signInWithEmailAndPassword(correo, password);
    } catch(e) {
      errEl.textContent = "Correo o contraseña incorrectos.";
      errEl.classList.remove("d-none");
    }
  }
  document.addEventListener("keydown", e => { if(e.key==="Enter") iniciarSesion(); });
</script>
</body></html>

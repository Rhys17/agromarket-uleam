<!DOCTYPE html>
<html lang="es"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pedidos — Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="../css/style.css">
</head><body>
<nav class="navbar navbar-dark" style="background-color:#1B5E20">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="dashboard.html"> Admin — Agro Market</a>
    <div class="navbar-nav flex-row gap-3">
      <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
      <a class="nav-link text-white" href="productos.html">Productos</a>
      <a class="nav-link text-white" href="pedidos.html">Pedidos</a>
      <a class="nav-link text-white" href="../catalogo.html">Ver sitio</a>
      <a class="nav-link text-white" href="#" onclick="cerrarSesion()">Salir</a>
    </div>
  </div>
</nav>
<div class="container py-4">
  <h4 class="fw-bold text-success mb-3"> Pedidos</h4>

  <!-- Filtro por estado -->
  <div class="mb-3">
    <select id="filtro-estado" class="form-select" style="max-width:250px"
            onchange="cargarPedidos()">
      <option value="">Todos los estados</option>
      <option value="pendiente">Pendiente</option>
      <option value="confirmado">Confirmado</option>
      <option value="en_preparacion">En Preparación</option>
      <option value="en_camino">En Camino</option>
      <option value="entregado">Entregado</option>
      <option value="cancelado">Cancelado</option>
    </select>
  </div>

  <div class="card shadow-sm border-0">
    <div id="tabla-pedidos">
      <div class="p-4 text-center"><div class="spinner-border text-success"></div></div>
    </div>
  </div>
</div>

  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/db.js"></script>
<script>
  protegerPagina(["administrador"]);

  const colorEstado = {
    pendiente:"warning", confirmado:"info", en_preparacion:"primary",
    en_camino:"secondary", entregado:"success", cancelado:"danger"
  };

  async function iniciarPagina() {
    cargarNavbar();
    cargarPedidos();
  }

  async function cargarPedidos() {
    const estado = document.getElementById("filtro-estado").value;
    let query = db.collection("pedidos").orderBy("created_at","desc");
    if (estado) query = db.collection("pedidos").where("estado","==",estado);
    const snap = await query.get();
    const pedidos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const el = document.getElementById("tabla-pedidos");

    if (!pedidos.length) {
      el.innerHTML = `<p class="text-center text-muted p-4">No hay pedidos.</p>`;
      return;
    }

    el.innerHTML = `<table class="table mb-0 align-middle table-hover">
      <thead class="table-success">
        <tr><th>#</th><th>Cliente</th><th>Total</th><th>Estado</th>
            <th>Fecha</th><th>Acción</th></tr>
      </thead>
      <tbody>
        ${pedidos.map((p,i) => `<tr>
          <td class="fw-bold small">${p.id.slice(0,6).toUpperCase()}</td>
          <td><small>${p.cliente_nombre || p.cliente_id?.slice(0,10) || "—"}</small></td>
          <td class="fw-bold text-success">${fmt(p.total || 0)}</td>
          <td><span class="badge bg-${colorEstado[p.estado]||"secondary"}">
            ${ETIQUETAS_ESTADO[p.estado]||p.estado}</span></td>
          <td><small>${p.created_at?.toDate?.()?.toLocaleDateString("es-EC")||"—"}</small></td>
          <td>
            <select class="form-select form-select-sm" style="min-width:160px"
                    onchange="cambiarEstadoPedido('${p.id}','${p.estado}',this.value)">
              <option value="">— cambiar estado —</option>
              ${(TRANSICIONES_VALIDAS[p.estado]||[]).map(e =>
                `<option value="${e}">${ETIQUETAS_ESTADO[e]}</option>`
              ).join("")}
            </select>
          </td>
        </tr>`).join("")}
      </tbody>
    </table>`;
  }

</script>
</body></html>
